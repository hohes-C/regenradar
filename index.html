<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Regenradar</title>
    <meta name="description" content="Regen-Nowcast fuer die naechsten 2 Stunden, Datenbasis DWD via Bright Sky." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Regen" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />

    <meta name="theme-color" content="#2a2140" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-state="loading" data-tab="rain">
    <div class="app">
      <!-- Reiter 1: Regen -->
      <section class="view view-rain" id="view-rain">
        <header class="topbar">
          <button class="icon-btn" id="places-btn" type="button" aria-label="Orte">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-places" /></svg>
          </button>
          <button class="icon-btn" id="refresh" type="button" aria-label="Aktualisieren">
            <svg class="refresh-glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh" /></svg>
          </button>
        </header>

        <div class="hero">
          <div class="hero-icon" id="hero-icon" aria-hidden="true"></div>
          <div class="title-box"><h1 class="title" id="title">&nbsp;</h1></div>
          <p class="place-line">
            <svg class="place-arrow" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow" /></svg>
            <span id="place-name">Aktueller Standort</span>
          </p>
        </div>

        <div class="banner" id="banner" hidden>
          <span class="banner-text" id="banner-text"></span>
          <button class="retry" id="retry" type="button">Erneut</button>
        </div>

        <div class="scroll" id="rain-scroll">
          <section class="card" aria-label="Regenvorhersage">
            <h2 class="card-head">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-clock" /></svg>
              Regenvorhersage
            </h2>
            <p class="detail" id="detail"></p>
            <div class="timeline-wrap">
              <div class="timeline" id="timeline"></div>
              <div class="ticks" id="ticks"></div>
            </div>
          </section>

          <section class="card card-radar" aria-label="Regenradar">
            <h2 class="card-head">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-radar" /></svg>
              Radar
              <span class="card-note"><span id="status">&nbsp;</span><span id="checked"></span></span>
            </h2>
            <div class="radar-canvas-wrap">
              <canvas id="radar-bg" class="radar-bg" aria-hidden="true"></canvas>
              <canvas id="radar" class="radar-canvas"></canvas>
              <span class="radar-time" id="radar-time">jetzt</span>
              <a class="radar-attrib" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
            </div>
            <div class="radar-legend" id="radar-legend" aria-hidden="true"></div>
          </section>
        </div>

        <nav class="places" id="places" aria-label="Orte" hidden></nav>
      </section>

      <!-- Reiter 2: Warnungen -->
      <section class="view view-alerts" id="view-alerts">
        <header class="topbar">
          <h1 class="view-title">Warnungen</h1>
          <button class="icon-btn" id="alerts-refresh" type="button" aria-label="Aktualisieren">
            <svg class="refresh-glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh" /></svg>
          </button>
        </header>
        <p class="place-line place-line-left">
          <svg class="place-arrow" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow" /></svg>
          <span id="alerts-place">&nbsp;</span>
        </p>
        <div class="scroll" id="alerts-scroll"></div>
      </section>

      <nav class="tabbar" aria-label="Ansicht">
        <button class="tab" data-tab="rain" type="button" aria-current="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop" /></svg>
          <span>Regen</span>
        </button>
        <button class="tab" data-tab="alerts" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-warn" /></svg>
          <span>Warnungen</span>
          <i class="tab-badge" id="tab-badge" hidden></i>
        </button>
      </nav>
    </div>

    <!-- Symbolvorrat. Strichzeichnungen, erben die Textfarbe. -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-places" viewBox="0 0 24 24">
        <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        <circle cx="12" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="2" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M21 3 3 10.5l7.5 3L13.5 21 21 3Z" fill="currentColor" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 7v5.2l3.4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </symbol>
      <symbol id="i-radar" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="12" r="1.4" fill="currentColor" />
      </symbol>
      <symbol id="i-drop" viewBox="0 0 24 24">
        <path d="M12 3.2c3.4 4.2 5.4 7 5.4 9.4a5.4 5.4 0 0 1-10.8 0C6.6 10.2 8.6 7.4 12 3.2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-warn" viewBox="0 0 24 24">
        <path d="M12 3.6 22 20.4H2L12 3.6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        <path d="M12 10v4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="12" cy="17.4" r="1.15" fill="currentColor" />
      </symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24">
        <path d="M13.4 2 4.8 13.4h5.3L9.4 22l8.8-11.6h-5.4L13.4 2Z" fill="currentColor" />
      </symbol>
      <symbol id="i-wind" viewBox="0 0 24 24">
        <path d="M3 8h10.2a3 3 0 1 0-3-3M3 12.5h14a3 3 0 1 1-3 3M3 17h7.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </symbol>
      <symbol id="i-snow" viewBox="0 0 24 24">
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9" />
        </g>
      </symbol>
      <symbol id="i-heat" viewBox="0 0 24 24">
        <path d="M13.5 13.4V5a1.75 1.75 0 1 0-3.5 0v8.4a4 4 0 1 0 3.5 0Z" fill="none" stroke="currentColor" stroke-width="2" />
      </symbol>
      <symbol id="i-fog" viewBox="0 0 24 24">
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 8h16M4 12h16M7 16h13M4 20h11" />
        </g>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="m8 12.3 2.7 2.7L16 9.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
    </svg>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
